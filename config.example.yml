# Security Scan at Scale — Example Configuration
# Copy this file to config.yml and fill in your values.

# Maximum number of (repo, model) scans to run concurrently.
concurrency: 6

# Directory where repos are cloned for scanning.
workspaceDir: ./workspaces

# Directory where per-scan reports and the summary are written.
resultsDir: ./results

# Copilot model identifiers to scan with.
models:
  - gpt-5.4
  # - claude-sonnet-4-6

# GitHub repositories to scan.
repos:
  - url: https://github.com/your-org/your-repo-1
    # ref: main   # optional branch/tag/SHA; defaults to default branch
  - url: https://github.com/your-org/your-repo-2

# APM pack to install into each cloned repo before scanning.
# Must be a valid pack identifier understood by `apm install`.
apmPack: ricardocovo/security-scan-at-scale/packs/repo-security-scan

# Security-scan prompts to execute per (repo, model) pair.
# Each runs in a fresh Copilot SDK session.
securityScanCommands:
  - name: "Security Reviewer 1"
    prompt: |
      Execute all the instrucitons on .github\prompts\security-review.prompt.md

# Optional: summarization commands run ONCE globally after all per-repo scans
# complete. They execute in a fresh Copilot SDK session whose working directory
# is the resultsDir above, so they can read/aggregate every scan's artifacts.
# When set, summarizationModel is required (and vice versa).
#summarizationModel: gpt-4.1
#summarizationCommands:
#  - name: "Summarize Findings"
#    prompt: |
#      Use the agent at github\agents\summarization.agent.md to summarize results.


# Maximum time (in milliseconds) to wait for a single Copilot session before treating it as failed.
sessionTimeoutMs: 7200000
